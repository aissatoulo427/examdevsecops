name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales par defaut : chaque job elargit uniquement ce dont il
# a besoin. Un jeton trop large est exploitable par n'importe quelle
# dependance executee pendant le build.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # URL publique de l'application. Elle vit ici et non dans une variable
  # GitHub : ce n'est pas un secret, et une valeur portee par la
  # configuration du depot est invisible a la lecture du code. Quand elle
  # etait absente, le smoke test appelait curl sur "/healthz" sans hote et
  # echouait a chaque tentative sans que la cause soit lisible.
  APP_URL: https://examdevsecops.onrender.com

jobs:
  qualite:
    name: Qualite et tests
    runs-on: ubuntu-latest
    steps:
      # Toutes les actions sont epinglees par SHA de commit et non par tag :
      # un tag peut etre redirige vers un autre contenu, un SHA non.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : Gitleaks doit inspecter tous les commits, un
          # secret supprime depuis reste compromis.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verification des types
        run: npm run typecheck

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Detection de secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chemin explicite : sans lui, la configuration peut ne pas etre
          # trouvee selon le repertoire de travail de l'action.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Scan des dependances
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Build, scan et publication
    needs: qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publication.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # L'image est construite localement puis scannee AVANT toute
      # publication. Publier d'abord et scanner ensuite laisserait une image
      # vulnerable accessible dans le registre, meme quelques secondes.
      - name: Construction locale pour analyse
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: examdevsecops:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: examdevsecops:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Connexion a GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reconstruction depuis le cache : les couches sont identiques a celles
      # qui viennent d'etre scannees.
      - name: Publication
        id: publication
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

  deploiement:
    name: Deploiement Render
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # L'environnement porte le secret du deploy hook : une pull request, meme
    # ouverte depuis un fork, ne peut ni le lire ni declencher un deploiement.
    environment:
      name: production
      url: https://examdevsecops.onrender.com
    steps:
      # Le service Render est adosse au depot Git, pas au registre : il
      # reconstruit l'image depuis le Dockerfile du commit courant. On ne peut
      # donc pas lui imposer le digest scanne via imgURL, le hook repond 400.
      #
      # Limite assumee, a consigner dans le rapport : l'artefact mis en ligne
      # n'est pas bit a bit celui que Trivy a scanne, seulement son equivalent
      # reconstruit depuis la meme source. La barriere de securite tient
      # malgre tout, puisque ce job ne s'execute que si le scan du job image a
      # reussi sur ce meme commit.
      - name: Declencher le deploiement Render
        run: |
          set -euo pipefail
          hook="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$hook" ]; then
            echo "Le secret RENDER_DEPLOY_HOOK_URL est vide ou inaccessible."
            echo "Il doit exister sous ce nom exact dans l'environnement 'production',"
            echo "en tant que secret et non en tant que variable."
            exit 1
          fi
          echo "Commit deploye : ${{ github.sha }}"
          echo "Image equivalente scannee et publiee : ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$hook")
          if [ "$code" != "200" ]; then
            echo "Le deploy hook a repondu ${code}."
            exit 1
          fi

      # Un hook accepte est une promesse, pas une mise en ligne : sans cette
      # verification le pipeline serait vert alors que le service est casse,
      # exactement le cas rencontre avec les chemins temporaires nginx.
      #
      # Ce que la sonde prouve : le service repond 200. Ce qu'elle ne prouve
      # pas : qu'il s'agit bien de la nouvelle version, l'ancienne restant en
      # ligne pendant la reconstruction. Le distinguer demanderait une route
      # exposant le commit deployé.
      - name: Attendre la mise en ligne puis verifier
        run: |
          set -euo pipefail
          # Render reconstruit l'image avant de la mettre en ligne : sonder
          # tout de suite ne mesurerait que l'etat d'avant le deploiement.
          sleep 90
          for tentative in $(seq 1 40); do
            # curl imprime deja '000' quand il echoue : un '|| echo 000'
            # concatenerait les deux et produirait '000000'.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
              "${APP_URL}/healthz" 2>/dev/null || true)
            # Forme 'if' et non '[ ... ] && ...' : sous 'set -e', un test
            # faux en fin d'instruction interrompt le script.
            if [ -z "$code" ]; then code="000"; fi
            echo "Tentative ${tentative} : HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Deploiement verifie."
              exit 0
            fi
            sleep 20
          done
          echo "Le service n'a pas repondu 200 dans le delai imparti."
          exit 1
