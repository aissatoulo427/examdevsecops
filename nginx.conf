worker_processes auto;
pid /var/cache/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    # Chemins temporaires sous /var/cache/nginx, et non /tmp : certaines
    # plateformes (Render) montent un /tmp neuf au demarrage, ce qui efface
    # le repertoire prepare dans l'image et fait echouer nginx.
    #
    # Ils doivent rester des enfants DIRECTS de /var/cache/nginx : nginx cree
    # le dernier segment du chemin mais pas les parents, et ce repertoire est
    # le point de montage utilise quand la racine est en lecture seule.
    client_body_temp_path /var/cache/nginx/client;
    proxy_temp_path       /var/cache/nginx/proxy;
    fastcgi_temp_path     /var/cache/nginx/fastcgi;
    uwsgi_temp_path       /var/cache/nginx/uwsgi;
    scgi_temp_path        /var/cache/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # connect-src n'autorise que Fake Store API : c'est la traduction en
        # politique navigateur du fait que l'application n'a qu'une seule
        # dependance reseau legitime.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://fakestoreapi.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            # default_type et non add_header : pour une reponse construite par
            # return, add_header n'ecrase pas le type MIME par defaut.
            default_type text/plain;
            return 200 "ok\n";
        }

        # Les noms de fichiers produits par Vite contiennent une empreinte du
        # contenu : ils peuvent donc etre caches indefiniment sans risque.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
