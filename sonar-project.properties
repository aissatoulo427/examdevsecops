sonar.projectKey=aissatoulo427_examdevsecops
sonar.organization=aissatoulo427
sonar.projectName=Exam DevSecOps - Frontend E-Commerce

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/test/**,**/*.test.ts,**/*.test.tsx

# Couverture produite par `npm run test:coverage` avant l'analyse.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Sans cette ligne, le scanner televerse l'analyse et rend la main
# immediatement : l'etape reussit meme quand la Quality Gate est rouge, et la
# porte annoncee comme bloquante ne bloque rien. Avec elle, le scanner attend
# le verdict du serveur et echoue s'il est negatif.
sonar.qualitygate.wait=true
